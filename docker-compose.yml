version: "3.8"

services:
  python-games:
    image: nginx:alpine
    container_name: python-games
    restart: unless-stopped
    ports:
      - "3100:80"         # port local NAS (Cloudflare tunnel pointe ici)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - games-net

networks:
  games-net:
    driver: bridge
