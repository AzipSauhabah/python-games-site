<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Super Mario Bros — World 1-1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#loading{
  position:fixed;inset:0;background:#6b8cff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Courier New',monospace;color:#fff;gap:16px;z-index:100;
}
#lbar-bg{width:200px;height:6px;background:rgba(0,0,0,.3);}
#lbar{height:100%;width:0%;background:#fff;transition:width .05s;}
#ltxt{font-size:11px;opacity:.7;letter-spacing:1px;}
</style>
</head>
<body>
<div id="loading">
  <div style="font-size:24px;font-weight:bold;letter-spacing:3px;">SUPER MARIO BROS</div>
  <div id="lbar-bg"><div id="lbar"></div></div>
  <div id="ltxt">Loading assets...</div>
</div>
<canvas id="c"></canvas>
<script>
const RAW='https://raw.githubusercontent.com/AzipSauhabah/PythonProjects/main/Mario-Level-1-master/resources';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const SW=800,SH=600;
canvas.width=SW;canvas.height=SH;

function resize(){
  const s=Math.min(innerWidth/SW,innerHeight/SH);
  canvas.style.cssText=`display:block;position:absolute;image-rendering:pixelated;
    width:${SW*s}px;height:${SH*s}px;
    left:${(innerWidth-SW*s)/2}px;top:${(innerHeight-SH*s)/2}px`;
}
addEventListener('resize',resize);resize();

// ── Audio ──────────────────────────────────────────────
const A={},S={};
let aCtx=null,bgNode=null;

function initAudio(){
  if(aCtx)return;
  aCtx=new(window.AudioContext||window.webkitAudioContext)();
  decodePending();
}
function loadImg(k,u){return new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{A[k]=i;r()};i.onerror=r;i.src=u});}
const pendingAudio={};
function loadAudio(k,u){
  return new Promise(r=>{
    // Stocker le buffer raw, decoder apres init audio
    fetch(u).then(x=>x.arrayBuffer()).then(b=>{
      pendingAudio[k]=b;
      if(aCtx)aCtx.decodeAudioData(b.slice(0),d=>{S[k]=d},()=>{});
      r();
    }).catch(r);
  });
}
function decodePending(){
  if(!aCtx)return;
  for(const[k,b] of Object.entries(pendingAudio)){
    if(!S[k])aCtx.decodeAudioData(b.slice(0),d=>{S[k]=d},()=>{});
  }
}
function snd(k,v=1){
  if(!aCtx||!S[k])return;
  const n=aCtx.createBufferSource(),g=aCtx.createGain();
  n.buffer=S[k];g.gain.value=v;n.connect(g);g.connect(aCtx.destination);n.start(0);
}
function music(k,loop=true){
  stopMusic();
  if(!aCtx||!S[k])return;
  bgNode=aCtx.createBufferSource();
  bgNode.buffer=S[k];bgNode.loop=loop;
  const g=aCtx.createGain();g.gain.value=0.35;
  bgNode.connect(g);g.connect(aCtx.destination);bgNode.start(0);
}
function stopMusic(){try{bgNode&&bgNode.stop()}catch(e){}bgNode=null;}

async function loadAll(){
  const lbar=document.getElementById('lbar'),ltxt=document.getElementById('ltxt');
  // Ne pas init audio ici — Safari bloque sans geste utilisateur
  // On init au premier clic/touche
  const imgs=[
    ['ts',`${RAW}/graphics/title_screen.png`],
    ['bg',`${RAW}/graphics/level_1.png`],
    ['mario',`${RAW}/graphics/mario_bros.png`],
    ['enemies',`${RAW}/graphics/smb_enemies_sheet.png`],
    ['items',`${RAW}/graphics/item_objects.png`],
    ['tiles',`${RAW}/graphics/tile_set.png`],
  ];
  const snds=[
    ['theme',`${RAW}/music/main_theme.ogg`],
    ['gameover',`${RAW}/music/game_over.ogg`],
    ['clear',`${RAW}/music/stage_clear.wav`],
    ['death',`${RAW}/music/death.wav`],
    ['js',`${RAW}/sound/small_jump.ogg`],
    ['jb',`${RAW}/sound/big_jump.ogg`],
    ['coin',`${RAW}/sound/coin.ogg`],
    ['stomp',`${RAW}/sound/stomp.ogg`],
    ['powerup',`${RAW}/sound/powerup.ogg`],
    ['papp',`${RAW}/sound/powerup_appears.ogg`],
    ['bump',`${RAW}/sound/bump.ogg`],
    ['brick',`${RAW}/sound/brick_smash.ogg`],
    ['flag',`${RAW}/music/flagpole.wav`],
  ];
  const tot=imgs.length+snds.length;let done=0;
  const tick=()=>{lbar.style.width=(++done/tot*100)+'%'};
  await Promise.all(imgs.map(([k,u])=>loadImg(k,u).then(tick)));
  ltxt.textContent='Loading audio...';
  await Promise.all(snds.map(([k,u])=>loadAudio(k,u).then(tick)));
}

// ── Input ──────────────────────────────────────────────
const K={};
addEventListener('keydown',e=>{K[e.code]=true;if(!aCtx)initAudio();aCtx?.state==='suspended'&&aCtx.resume();e.preventDefault()});
addEventListener('keyup',e=>{K[e.code]=false});
// Safari: unlock audio on any user gesture on the canvas
canvas.addEventListener('click',()=>{if(!aCtx)initAudio();aCtx?.state==='suspended'&&aCtx.resume();});
canvas.addEventListener('touchstart',()=>{if(!aCtx)initAudio();aCtx?.state==='suspended'&&aCtx.resume();},{passive:true});
const isL=()=>K.ArrowLeft||K.KeyA;
const isR=()=>K.ArrowRight||K.KeyD;
const isJ=()=>K.Space||K.ArrowUp||K.KeyW;
const isRun=()=>K.ShiftLeft||K.ShiftRight||K.KeyS;
const anyKey=()=>Object.values(K).some(v=>v);

// ── Constants ──────────────────────────────────────────
const BG=2.679,GY=538,LW=9073,HH=42,GR=0.5,MF=12;

// ── State ──────────────────────────────────────────────
let gst='title',score=0,coins=0,lives=3,timer=400;
let tiTick=0,frame=0,camX=0,musicOn=false;
let deathT=0,clearT=0,jumpHeld=false;

// ── Mario ──────────────────────────────────────────────
const M={x:96,y:GY-40,vx:0,vy:0,w:30,h:40,onGround:false,
  right:true,big:false,dead:false,inv:false,invT:0,aF:0,aT:0,st:'stand'};

const SF={stand:{x:178,y:32,w:12,h:16},walk1:{x:80,y:32,w:15,h:16},
  walk2:{x:96,y:32,w:16,h:16},walk3:{x:112,y:32,w:16,h:16},
  jump:{x:144,y:32,w:16,h:16},skid:{x:130,y:32,w:14,h:16},death:{x:160,y:32,w:15,h:16}};
const BF={stand:{x:176,y:0,w:16,h:32},walk1:{x:81,y:0,w:16,h:32},
  walk2:{x:97,y:0,w:16,h:32},walk3:{x:113,y:0,w:16,h:32},
  jump:{x:145,y:0,w:16,h:32},skid:{x:130,y:0,w:14,h:32}};

function mFrame(){
  if(M.dead)return SF.death;
  const F=M.big?BF:SF;
  if(!M.onGround)return F.jump;
  if(M.st==='skid')return F.skid;
  if(Math.abs(M.vx)<0.1)return F.stand;
  return[F.walk1,F.walk2,F.walk3,F.walk2][M.aF%4];
}
function drawMario(){
  if(M.inv&&frame%4<2)return;
  const f=mFrame();if(!f||!A.mario)return;
  const sc=2.5,dw=f.w*sc,dh=f.h*sc,sx=M.x-camX,sy=M.y;
  ctx.save();
  if(!M.right){ctx.translate(sx+dw/2,sy);ctx.scale(-1,1);ctx.drawImage(A.mario,f.x,f.y,f.w,f.h,-dw/2,0,dw,dh);}
  else ctx.drawImage(A.mario,f.x,f.y,f.w,f.h,sx,sy,dw,dh);
  ctx.restore();
}

// ── Solids ─────────────────────────────────────────────
const solids=[
  {x:0,y:GY,w:7909,h:200,t:'g'},{x:8157,y:GY,w:1000,h:200,t:'g'},
];
// Pipes (x,y,w) — extend to ground
[[1202,452,83],[1631,409,83],[1973,366,83],[2445,366,83],[6989,452,83],[7675,452,83]]
.forEach(([x,y,w])=>solids.push({x,y,w,h:GY-y+200,t:'p'}));
// Steps
[[5745,495,40,44],[5788,452,40,44],[5831,409,40,44],[5874,366,40,176],
 [6001,366,40,176],[6044,408,40,40],[6087,452,40,40],[6130,495,40,40],
 [6345,495,40,40],[6388,452,40,40],[6431,409,40,40],[6474,366,40,40],
 [6517,366,40,176],[6644,366,40,176],[6687,408,40,40],[6728,452,40,40],
 [6771,495,40,40],[7760,495,40,40],[7803,452,40,40],[7845,409,40,40],
 [7888,366,40,40],[7931,323,40,40],[7974,280,40,40],[8017,237,40,40],
 [8060,194,40,40],[8103,194,40,360],[8488,495,40,40]]
.forEach(([x,y,w,h])=>solids.push({x,y,w,h,t:'s'}));

const bricks=[
  [858,365],[944,365],[1030,365],[3299,365],[3385,365],
  [3430,193],[3473,193],[3516,193],[3559,193],[3602,193],[3645,193],[3688,193],[3731,193],
  [3901,193],[3944,193],[3987,193],[4030,365],[4287,365],[4330,365],
  [5058,365],[5187,193],[5230,193],[5273,193],[5488,193],[5574,193],[5617,193],
  [5531,365],[5574,365],[7202,365],[7245,365],[7331,365],
].map(([x,y])=>({x,y,w:40,h:40,t:'brick',alive:true,bT:0}));

const cboxes=[
  [685,365,'coin'],[901,365,'mush'],[987,365,'coin'],[943,193,'coin'],
  [3342,365,'mush'],[4030,193,'coin'],[4544,365,'coin'],
  [4672,365,'coin'],[4672,193,'mush'],[4800,365,'coin'],
  [5531,193,'coin'],[7288,365,'coin'],
].map(([x,y,c])=>({x,y,w:40,h:40,t:'cbox',used:false,contents:c,bT:0}));

const FLAG={x:8505,pY:64,pH:474,fY:100};

let flyCoins=[],floatScore=[],mush=[];

function spawnE(){
  return[[1600],[2050],[2500],[2550],[3100],[3150],[3800],[3850],
    [4600],[5000],[5050],[5500],[5550],[7000],[7050],[7500],[7550]]
  .map(([x])=>({x,y:GY-32,w:32,h:32,vx:-1.5,vy:0,alive:true,stomped:false,sT:0,aF:0,aT:0,onGround:false,active:false}));
}
let enemies=spawnE();

// ── Collision ──────────────────────────────────────────
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function getAllSolids(){
  const out=[...solids];
  bricks.forEach(b=>{if(b.alive)out.push(b)});
  cboxes.forEach(c=>{out.push(c)});
  return out;
}

function moveEntity(e,sl){
  e.onGround=false;
  e.x+=e.vx; e.x=Math.max(0,e.x);
  for(const s of sl){
    if(!ov(e,s))continue;
    if(e.vx>0)e.x=s.x-e.w;else e.x=s.x+s.w;
    e.vx=0;
  }
  e.y+=e.vy;
  for(const s of sl){
    if(!ov(e,s))continue;
    if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;}
    else{hitBelow(e,s);e.y=s.y+s.h;e.vy=0;}
  }
}

function hitBelow(e,s){
  if(e!==M)return;
  if(s.t==='brick'&&s.alive){
    if(M.big){s.alive=false;snd('brick');score+=50;}
    else{s.bT=1;snd('bump');}
  }else if(s.t==='cbox'&&!s.used){
    s.used=true;s.bT=1;
    if(s.contents==='coin'){addCoin(s.x+20,s.y-20);}
    else if(s.contents==='mush'){addMush(s.x,s.y-40);}
    score+=200;
  }
}

function addCoin(x,y){flyCoins.push({x,y,vy:-8,t:0});coins++;score+=200;addFS(x,y,200);snd('coin');}
function addMush(x,y){mush.push({x,y,w:32,h:32,vx:2,vy:0,alive:true,onGround:false});snd('papp');}
function addFS(x,y,pts){floatScore.push({x,y,pts,t:0});}

// ── Draw bg ────────────────────────────────────────────
function drawBG(){
  if(!A.bg){ctx.fillStyle='#6b8cff';ctx.fillRect(0,HH,SW,SH-HH);return;}
  ctx.drawImage(A.bg,camX/BG,0,SW/BG,224,0,HH,SW,SH-HH);
}

// ── Draw blocks ────────────────────────────────────────
function drawBlocks(){
  const bmp=b=>b.bT>0?Math.sin(b.bT/20*Math.PI)*-8:0;
  bricks.forEach(b=>{
    if(!b.alive)return;
    const sx=b.x-camX;if(sx<-50||sx>SW+50)return;
    if(!A.tiles){ctx.fillStyle='#c84c0c';ctx.fillRect(sx,b.y+bmp(b),40,40);return;}
    ctx.drawImage(A.tiles,16,0,16,16,sx,b.y+bmp(b),40,40);
  });
  cboxes.forEach(c=>{
    const sx=c.x-camX;if(sx<-50||sx>SW+50)return;
    const bump=bmp(c);
    if(!A.tiles){ctx.fillStyle=c.used?'#888':'#e8a000';ctx.fillRect(sx,c.y+bump,40,40);return;}
    const tx=c.used?432:(frame%30<10?384:frame%30<20?400:416);
    ctx.drawImage(A.tiles,tx,0,16,16,sx,c.y+bump,40,40);
  });
}

// ── Draw enemies ───────────────────────────────────────
function drawEnemies(){
  enemies.forEach(e=>{
    if(!e.alive||!e.active)return;
    const sx=e.x-camX;if(sx<-50||sx>SW+50)return;
    if(!A.enemies){ctx.fillStyle=e.stomped?'#600':'#a00';ctx.fillRect(sx,e.y,e.w,e.h);return;}
    const fx=e.stomped?32:(Math.floor(e.aF/8)%2)*16;
    ctx.drawImage(A.enemies,fx,4,16,16,sx,e.y,e.w,e.h);
  });
}

// ── Draw mushrooms ─────────────────────────────────────
function drawMush(){
  mush.forEach(m=>{
    if(!m.alive)return;
    const sx=m.x-camX;
    if(!A.items){ctx.fillStyle='#e00';ctx.fillRect(sx,m.y,m.w,m.h);return;}
    ctx.drawImage(A.items,0,0,16,16,sx,m.y,m.w,m.h);
  });
}

// ── Draw coins/scores ──────────────────────────────────
function drawFlyCoins(){
  ctx.fillStyle='#ffd700';
  flyCoins.forEach(c=>{ctx.beginPath();ctx.arc(c.x-camX,c.y,8,0,Math.PI*2);ctx.fill();});
}
function drawFS(){
  ctx.font='bold 13px monospace';
  floatScore.forEach(s=>{
    ctx.globalAlpha=Math.max(0,1-s.t/55);
    ctx.fillStyle='#fff';ctx.fillText(s.pts,s.x-camX,s.y);
  });
  ctx.globalAlpha=1;
}

// ── Draw flag ──────────────────────────────────────────
function drawFlag(){
  const sx=FLAG.x-camX;if(sx<-20||sx>SW+20)return;
  ctx.fillStyle='#aaa';ctx.fillRect(sx-2,FLAG.pY,6,FLAG.pH);
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(sx+1,FLAG.pY,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0a0';ctx.fillRect(sx+4,FLAG.fY,36,22);
}

// ── HUD ────────────────────────────────────────────────
function drawHUD(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,SW,HH);
  ctx.fillStyle='#fff';ctx.font='bold 14px "Courier New",monospace';
  ctx.fillText('MARIO',30,14);
  ctx.fillText(String(score).padStart(6,'0'),30,30);
  ctx.fillText('♥×'+lives,175,22);
  ctx.fillText('●×'+String(coins).padStart(2,'0'),335,22);
  ctx.fillText('WORLD',470,14);ctx.fillText('  1-1',470,30);
  ctx.fillText('TIME',635,14);ctx.fillText(String(Math.max(0,timer)).padStart(3,' '),638,30);
}

// ── Title ──────────────────────────────────────────────
function drawTitle(){
  // Fond: level_1.png debut — meme que jeu Python
  if(A.bg){ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(A.bg,0,0,SW/BG,224,0,HH,SW,SH-HH);ctx.restore();}
  else{ctx.fillStyle='#6b8cff';ctx.fillRect(0,HH,SW,SH-HH);}
  // Logo box: title_screen.png crop (x=1,y=60,w=176,h=88) * 2.5 = 440x220
  if(A.ts){
    ctx.save();ctx.imageSmoothingEnabled=false;
    ctx.drawImage(A.ts,1,60,176,88,180,80,440,220);
    ctx.restore();
  }
  // Mario debout
  if(A.mario){ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(A.mario,178,32,12,16,110,GY-40,30,40);ctx.restore();}
  // Menu
  ctx.fillStyle='#fff';ctx.font='bold 18px "Courier New",monospace';ctx.textAlign='center';
  ctx.fillText('1 PLAYER GAME',400,355);
  ctx.fillText('2 PLAYER GAME',400,400);
  ctx.fillStyle='#ff0';ctx.font='20px monospace';ctx.fillText('►',330,355);
  if(frame%60<35){ctx.fillStyle='#fff';ctx.font='13px "Courier New",monospace';ctx.fillText('PRESS ANY KEY',400,470);}
  drawHUD();ctx.textAlign='left';
}

// ── Game Over ──────────────────────────────────────────
function drawGO(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,SW,SH);
  ctx.fillStyle='#fff';ctx.font='bold 40px "Courier New",monospace';
  ctx.textAlign='center';ctx.fillText('GAME OVER',400,280);
  if(frame%60<35){ctx.font='18px "Courier New",monospace';ctx.fillText('PRESS ANY KEY',400,360);}
  ctx.textAlign='left';
}

// ── Level clear ────────────────────────────────────────
function drawClear(){
  drawBG();drawFlag();drawMario();drawHUD();
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,SW,SH);
  ctx.fillStyle='#fff';ctx.font='bold 32px "Courier New",monospace';
  ctx.textAlign='center';ctx.fillText('COURSE CLEAR!',400,240);
  ctx.font='20px "Courier New",monospace';ctx.fillText('TIME BONUS  '+timer*50,400,310);
  ctx.textAlign='left';
}

// ── Update Mario ───────────────────────────────────────
function updateMario(){
  if(M.dead){
    deathT++;
    if(deathT===60)M.vy=-12;
    if(deathT>60){M.vy+=0.5;M.y+=M.vy;}
    if(deathT>180){
      lives--;
      if(lives<=0){gst='gameover';stopMusic();music('gameover',false);}
      else resetLevel();
    }
    return;
  }
  if(!musicOn&&anyKey()){musicOn=true;music('theme');}
  const spd=isRun()?5:3;
  M.w=M.big?38:30;M.h=M.big?72:40;
  if(isL()){M.vx=Math.max(M.vx-.4,-spd);M.right=false;M.st='walk';}
  else if(isR()){M.vx=Math.min(M.vx+.4,spd);M.right=true;M.st='walk';}
  else{M.vx*=0.82;if(Math.abs(M.vx)<.1){M.vx=0;M.st='stand';}}
  if((isL()&&M.vx>1)||(isR()&&M.vx<-1))M.st='skid';
  if(isJ()&&M.onGround&&!jumpHeld){M.vy=isRun()?-14:-12;jumpHeld=true;snd(M.big?'jb':'js');}
  if(!isJ())jumpHeld=false;
  if(!isJ()&&M.vy<-4)M.vy=Math.max(M.vy+2,-4);
  M.vy=Math.min(M.vy+GR,MF);
  M.x=Math.max(0,M.x);
  moveEntity(M,getAllSolids());
  camX=Math.max(0,Math.min(M.x-300,LW-SW));
  if(M.y>700)dieMario();
  // Sécurité: si Mario est dans le sol après transition big, le remonter
  if(M.y+M.h>GY+5&&M.onGround){M.y=GY-M.h;}
  if(M.inv){M.invT--;if(M.invT<=0)M.inv=false;}
  M.aT++;if(M.aT>7){M.aT=0;M.aF++;}
  tiTick++;if(tiTick>40){tiTick=0;timer=Math.max(0,timer-1);}
  if(timer===0)dieMario();
}

function dieMario(){
  if(M.inv)return;
  M.dead=true;M.vy=0;stopMusic();snd('death');deathT=0;gst='dead';
}

// ── Update enemies ─────────────────────────────────────
function updateEnemies(){
  const sl=getAllSolids();
  enemies.forEach(e=>{
    if(!e.alive)return;
    const sx=e.x-camX;
    // Activer quand Mario approche (depuis la droite seulement)
    if(!e.active&&sx<SW+80)e.active=true;
    if(!e.active)return;
    if(sx<-200){e.alive=false;return;}
    if(e.stomped){e.sT++;if(e.sT>40)e.alive=false;return;}
    e.vy=Math.min(e.vy+GR,MF);e.aT++;if(e.aT>8){e.aT=0;e.aF++;}
    e.x+=e.vx;
    for(const s of sl){if(ov(e,s)){if(e.vx<0)e.x=s.x+s.w;else e.x=s.x-e.w;e.vx*=-1;}}
    e.y+=e.vy;e.onGround=false;
    for(const s of sl){if(ov(e,s)){if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;}else{e.y=s.y+s.h;e.vy=0;}}}
    if(e.y>700){e.alive=false;return;}
    if(!M.dead&&!M.inv&&ov(M,e)){
      if(M.vy>0&&M.y+M.h-M.vy<=e.y+12){
        e.stomped=true;e.sT=0;M.vy=-8;score+=100;addFS(e.x,e.y,100);snd('stomp');
      }else{
        if(M.big){M.big=false;M.inv=true;M.invT=120;snd('powerup');}else dieMario();
      }
    }
  });
}

// ── Update mushrooms ───────────────────────────────────
function updateMush(){
  const sl=getAllSolids();
  mush.forEach(m=>{
    if(!m.alive)return;
    m.vy=Math.min(m.vy+GR,MF);m.x+=m.vx;
    for(const s of sl){if(ov(m,s)){if(m.vx>0)m.x=s.x-m.w;else m.x=s.x+m.w;m.vx*=-1;}}
    m.y+=m.vy;
    for(const s of sl){if(ov(m,s)){if(m.vy>0){m.y=s.y-m.h;m.vy=0;}else{m.y=s.y+m.h;m.vy=0;}}}
    if(ov(M,m)){
      m.alive=false;
      if(!M.big){
        M.big=true;
        M.y-=32; // ajuster la position Y pour compenser la hauteur supplementaire
      }
      score+=1000;addFS(m.x,m.y,1000);snd('powerup');
    }
    if(m.y>700)m.alive=false;
  });
}

// ── Update fly coins/scores ────────────────────────────
function updateFly(){
  flyCoins=flyCoins.filter(c=>{c.vy+=.5;c.y+=c.vy;return++c.t<45;});
  floatScore=floatScore.filter(s=>{s.y-=.8;return++s.t<55;});
}
function updateBumps(){
  [...bricks,...cboxes].forEach(b=>{if(b.bT>0)b.bT++;if(b.bT>20)b.bT=0;});
}

// ── Flagpole ───────────────────────────────────────────
function checkFlag(){
  if(gst!=='playing')return;
  if(M.x+M.w>=FLAG.x-4&&M.x<=FLAG.x+10){
    gst='flagslide';stopMusic();snd('flag');M.vx=0;
  }
}
function updateFlagSlide(){
  M.y=Math.min(M.y+3,GY-M.h);
  FLAG.fY=Math.min(FLAG.fY+3,FLAG.pY+FLAG.pH-22);
  M.x=FLAG.x-M.w-4;M.right=false;
  if(M.y>=GY-M.h){
    M.right=true;M.x+=M.w+10;score+=timer*50;timer=0;
    gst='levelclear';clearT=0;music('clear',false);
  }
}

// ── Reset ──────────────────────────────────────────────
function resetLevel(){
  Object.assign(M,{x:96,y:GY-40,vx:0,vy:0,w:30,h:40,onGround:false,
    right:true,big:false,dead:false,inv:false,invT:0,aF:0,aT:0,st:'stand'});
  camX=0;timer=400;tiTick=0;deathT=0;musicOn=false;jumpHeld=false;
  enemies=spawnE();
  bricks.forEach(b=>{b.alive=true;b.bT=0;});
  cboxes.forEach(c=>{c.used=false;c.bT=0;});
  flyCoins=[];floatScore=[];mush=[];
  FLAG.fY=100;gst='playing';
}

// ── Main loop ──────────────────────────────────────────
function loop(){
  frame++;ctx.clearRect(0,0,SW,SH);
  switch(gst){
    case'title':
      drawTitle();
      if(anyKey()){initAudio();resetLevel();}
      break;
    case'playing':
      updateMario();updateEnemies();updateMush();updateFly();updateBumps();checkFlag();
      drawBG();drawBlocks();drawEnemies();drawMush();drawFlyCoins();drawFlag();drawMario();drawFS();drawHUD();
      break;
    case'dead':
      updateMario();drawBG();drawHUD();drawMario();
      break;
    case'flagslide':
      updateFlagSlide();drawBG();drawBlocks();drawFlag();drawMario();drawHUD();
      break;
    case'levelclear':
      clearT++;drawClear();if(clearT>240)resetLevel();
      break;
    case'gameover':
      drawGO();if(anyKey()&&frame>180){lives=3;score=0;coins=0;resetLevel();}
      break;
  }
  requestAnimationFrame(loop);
}

(async()=>{
  await loadAll();
  document.getElementById('loading').style.display='none';
  gst='title';loop();
})();
</script>
