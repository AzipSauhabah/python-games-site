server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Headers requis pour WebAssembly (SharedArrayBuffer) ──
    # OBLIGATOIRE pour que pygbag/WASM tourne dans Chrome/Firefox
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # ── Cache statique long pour assets ──────────────────────
    location ~* \.(png|jpg|gif|ico|wav|ogg|mp3|ttf|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Répéter les headers COOP/COEP (nécessaire dans chaque bloc location)
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Fichiers WASM — type MIME correct ────────────────────
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Fichiers .apk de pygbag (archive Python WASM) ────────
    location ~* \.apk$ {
        default_type application/octet-stream;
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Route principale — site vitrine ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Jeux — dossier dédié ─────────────────────────────────
    location /games/ {
        alias /usr/share/nginx/html/games/;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
